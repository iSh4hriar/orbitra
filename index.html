(a) => { cnt[a.el] = (cnt[a.el] || 0) + 1; });\n  $('#legend').innerHTML = comp.hill.map((e) => `\u003cbutton type=\"button\" class=\"chip\" data-el=\"${esc(e)}\" aria-pressed=\"${!state.hidden.has(e)}\">\u003ci style=\"background:${EL[e] ? EL[e].color : '#ff69b4'}\">\u003c/i>${esc(e)}\u003cspan>${cnt[e]}\u003c/span>\u003c/button>`).join('');\n}\nfunction updateLegendCounts() { /* counts are per unit cell and do not change */ }\n\n/* neighbours cache */\nfunction getNb() {\n  if (!nbCache || nbCache.tol !== state.tol) nbCache = { tol: state.tol, res: siteNeighbors(S, state.tol) };\n  return nbCache.res;\n}\n\n/* ---------------- property tabs ---------------- */\nconst kv = (rows) => '\u003cdl class=\"kv\">' + rows.filter((r) => r && r[1] != null && r[1] !== '').map((r) => `\u003cdt>${r[0]}\u003c/dt>\u003cdd>${r[1]}\u003c/dd>`).join('') + '\u003c/dl>';\nconst given = (...t) => { const v = item(S.block, ...t); return v == null ? null : esc(v); };\n\nfunction tableHTML(heads, rows, opts) {\n  opts = opts || {};\n  const th = heads.map((h, i) => `\u003cth class=\"${opts.num && opts.num.includes(i) ? 'num' : ''}\">${h}\u003c/th>`).join('');\n  const tb = rows.map((r) => `\u003ctr${r.attr ? ' ' + r.attr : ''}>` + r.cells.map((c, i) => `\u003ctd class=\"${opts.num && opts.num.includes(i) ? 'num' : ''}${r.wrapIdx === i ? ' wrap' : ''}\">${c}\u003c/td>`).join('') + '\u003c/tr>').join('');\n  return `\u003cdiv class=\"tw${opts.tall ? ' tall' : ''}\">\u003ctable>\u003cthead>\u003ctr>${th}\u003c/tr>\u003c/thead>\u003ctbody>${tb}\u003c/tbody>\u003c/table>\u003c/div>`;\n}\n\nfunction summaryTab() {\n  const C = S.cell, R = S.recip, P = comp;\n  const name = given('_chemical_name_systematic', '_chemical_name_common', '_chemical_name_mineral');\n  const mineral = given('_chemical_name_mineral');\n  const nbAll = getNb();\n  const identity = kv([\n    ['Name', name && mineral && name !== mineral ? name + ' \u003csmall>(' + mineral + ')\u003c/small>' : name],\n    ['Formula', P.formulaHTML + (given('_chemical_formula_sum') ? ' \u003csmall>file: ' + given('_chemical_formula_sum') + '\u003c/small>' : '')],\n    ['Formula weight', fmt(P.formulaWeight, 3) + ' g/mol' + (given('_chemical_formula_weight') ? ' \u003csmall>file: ' + given('_chemical_formula_weight') + '\u003c/small>' : '')],\n    ['Formula units Z', P.z + (given('_cell_formula_units_z') ? ' \u003csmall>file: ' + given('_cell_formula_units_z') + '\u003c/small>' : '')],\n    ['Space group', S.sgName ? esc(S.sgName) : null],\n    ['IT number', S.itNum ? esc(S.itNum) : null],\n    ['Hall symbol', S.hall ? esc(S.hall) : null],\n    ['Crystal system', esc(S.system[0]) + ' \u003csmall>' + S.system[1] + '\u003c/small>'],\n    ['Lattice centering', esc(S.centering)],\n    ['Symmetry operators', S.ops.length],\n    ['Calculated density', fmt(P.density, 4) + ' g/cm³' + (given('_exptl_crystal_density_diffrn') ? ' \u003csmall>file: ' + given('_exptl_crystal_density_diffrn') + '\u003c/small>' : '')],\n    ['Atoms per cell', fmt(P.totalAtoms, 2) + ' \u003csmall>(' + S.cellAtoms.length + ' positions, ' + S.asym.length + ' unique sites)\u003c/small>'],\n  ]);\n  const cellTbl = tableHTML(['', 'a', 'b', 'c', 'α', 'β', 'γ', 'V'], [\n    { cells: ['File', given('_cell_length_a') || '–', given('_cell_length_b') || '–', given('_cell_length_c') || '–', given('_cell_angle_alpha') || '90', given('_cell_angle_beta') || '90', given('_cell_angle_gamma') || '90', given('_cell_volume') || '–'] },\n    { cells: ['Used', fmt(C.a, 5), fmt(C.b, 5), fmt(C.c, 5), fmt(C.alpha, 3), fmt(C.beta, 3), fmt(C.gamma, 3), fmt(C.vol, 4)] },\n    { cells: ['Reciprocal', fmt(R.a, 5), fmt(R.b, 5), fmt(R.c, 5), fmt(R.alpha, 3), fmt(R.beta, 3), fmt(R.gamma, 3), fmt(1 / C.vol, 6)] },\n  ], { num: [1, 2, 3, 4, 5, 6, 7] });\n  const bar = '\u003cdiv class=\"bar\">' + P.rows.map((r) => `\u003ci title=\"${r.el} ${fmt(r.wt, 2)} wt%\" style=\"width:${r.wt}%;background:${EL[r.el] ? EL[r.el].color : '#ff69b4'}\">\u003c/i>`).join('') + '\u003c/div>';\n  const compTbl = tableHTML(['Element', 'Atoms / cell', 'Atomic %', 'Weight %'], P.rows.map((r) => ({ cells: [`\u003cspan class=\"dot\" style=\"background:${EL[r.el] ? EL[r.el].color : '#ff69b4'}\">\u003c/span>${esc(r.el)}`, fmt(r.count, 3), fmt(r.at, 2), fmt(r.wt, 2)] })), { num: [1, 2, 3] });\n  const vec = (v) => v.map((x) => fmt(x, 5)).join(', ');\n  const latTbl = tableHTML(['Vector', 'x', 'y', 'z', 'Length'], [['a', S.L.A], ['b', S.L.B], ['c', S.L.C]].map(([n, v]) => ({ cells: [n].concat(v.map((x) => fmt(x, 5))).concat([fmt(Math.hypot(...v), 5)]) })), { num: [1, 2, 3, 4] });\n  const exp = kv([\n    ['Temperature', given('_diffrn_ambient_temperature', '_cell_measurement_temperature') ? given('_diffrn_ambient_temperature', '_cell_measurement_temperature') + ' K' : null],\n    ['Radiation', given('_diffrn_radiation_type', '_diffrn_radiation_probe')],\n    ['Wavelength', given('_diffrn_radiation_wavelength') ? given('_diffrn_radiation_wavelength') + ' Å' : null],\n    ['Crystal colour', given('_exptl_crystal_colour')],\n    ['Reflections', given('_reflns_number_total', '_diffrn_reflns_number')],\n    ['R factor', given('_refine_ls_r_factor_gt', '_refine_ls_r_factor_all')],\n    ['wR2', given('_refine_ls_wr_factor_ref', '_refine_ls_wr_factor_gt')],\n    ['Goodness of fit', given('_refine_ls_goodness_of_fit_ref')],\n    ['ICSD code', given('_database_code_icsd')],\n    ['AMCSD code', given('_database_code_amcsd')],\n    ['COD ID', given('_cod_database_code')],\n  ]);\n  const authors = col(S.block, '_publ_author_name');\n  const cite = kv([\n    ['Title', given('_publ_section_title')],\n    ['Authors', authors ? esc(authors.join('; ')) : null],\n    ['Journal', given('_journal_name_full') ? given('_journal_name_full') + [given('_journal_year') ? ' (' + given('_journal_year') + ')' : '', given('_journal_volume') ? ' vol. ' + given('_journal_volume') : '', given('_journal_page_first') ? ' p. ' + given('_journal_page_first') : ''].join('') : null],\n    ['DOI', given('_journal_paper_doi')],\n  ]);\n  return `\u003ch3>Identity\u003c/h3>${identity}\u003ch3>Composition\u003c/h3>${bar}${compTbl}\u003ch3>Unit cell\u003c/h3>${cellTbl}\u003cp class=\"note\">Lengths in Å, angles in degrees, volume in Å³. The reciprocal row lists a*, b*, c* in Å⁻¹, then α*, β*, γ* and 1/V.\u003c/p>\u003ch3>Lattice vectors (Å)\u003c/h3>${latTbl}` + (exp.includes('\u003cdt>') ? `\u003ch3>Experiment &amp; refinement\u003c/h3>${exp}` : '') + (cite.includes('\u003cdt>') ? `\u003ch3>Reference\u003c/h3>${cite}` : '');\n}\n\nfunction atomsTab() {\n  const nb = getNb();\n  const seg = `\u003cdiv class=\"seg mini-seg\" id=\"atomsSeg\">\u003cbutton type=\"button\" data-v=\"asym\" aria-pressed=\"${state.atomsView === 'asym'}\">Asymmetric unit (${S.asym.length})\u003c/button>\u003cbutton type=\"button\" data-v=\"cell\" aria-pressed=\"${state.atomsView === 'cell'}\">Whole unit cell (${S.cellAtoms.length})\u003c/button>\u003c/div>`;\n  let tbl;\n  if (state.atomsView === 'asym') {\n    tbl = tableHTML(['Label', 'El.', 'x', 'y', 'z', 'Occ.', 'U\u003csub>iso\u003c/sub>', 'Mult.', 'CN'], S.asym.map((a, si) => ({\n      attr: `class=\"pick${state.focus === a.label ? ' on' : ''}\" data-label=\"${esc(a.label)}\"`,\n      cells: [esc(a.label), esc(a.el), esc(a.raw[0]), esc(a.raw[1]), esc(a.raw[2]), fmt(a.occ, 3), a.uiso == null ? '–' : fmt(a.uiso, 4), esc((a.mult || S.cellAtoms.filter((c) => c.site === si).length) + (a.wyck ? ' ' + a.wyck : '')), nb[siteFirst[si]].length],\n    })), { num: [2, 3, 4, 5, 6, 8], tall: true });\n  } else {\n    tbl = tableHTML(['#', 'Label', 'El.', 'x', 'y', 'z', 'Occ.', 'CN'], S.cellAtoms.map((a, i) => ({\n      attr: `class=\"pick${state.focus === a.label ? ' on' : ''}\" data-label=\"${esc(a.label)}\"`,\n      cells: [i + 1, esc(a.label), esc(a.el), fmt(a.f[0], 5), fmt(a.f[1], 5), fmt(a.f[2], 5), fmt(a.occ, 3), nb[i].length],\n    })), { num: [0, 3, 4, 5, 6, 7], tall: true });\n  }\n  const cart = state.atomsView === 'cell' ? '' : '';\n  return `${seg}${tbl}\u003cp class=\"note\">Click a row to highlight that site in the 3D view; click it again to clear. CN is the coordination number from the bond tolerance in the controls. Cartesian positions appear when you click an atom in 3D.\u003c/p>${cart}`;\n}\n\nfunction bondsTab() {\n  const nb = getNb();\n  const types = {};\n  nb.forEach((list, i) => list.forEach((n) => {\n    const key = [S.cellAtoms[i].el, n.el].sort().join('–');\n    (types[key] = types[key] || []).push(n.d);\n  }));\n  const summ = Object.entries(types).sort((a, b) => a[0] \u003c b[0] ? -1 : 1).map(([k, ds]) => ({ cells: [k, fmt(ds.length / 2, 1), fmt(Math.min(...ds), 4), fmt(Math.max(...ds), 4), fmt(ds.reduce((s, x) => s + x, 0) / ds.length, 4)] }));\n  let html = '\u003ch3>Bond types\u003c/h3>' + (summ.length ? tableHTML(['Pair', 'Bonds / cell', 'Min Å', 'Max Å', 'Mean Å'], summ, { num: [1, 2, 3, 4] }) : '\u003cp class=\"empty\">No bonds found at this tolerance. Increase the bond tolerance slider.\u003c/p>');\n  html += '\u003ch3>Neighbours of each unique site\u003c/h3>';\n  S.asym.forEach((a, si) => {\n    const list = nb[siteFirst[si]];\n    const groups = new Map();\n    list.forEach((n) => { const k = n.label + '|' + n.d.toFixed(3); const g = groups.get(k); if (g) g.c++; else groups.set(k, { label: n.label, el: n.el, d: n.d, c: 1 }); });\n    const mean = list.length ? list.reduce((s, x) => s + x.d, 0) / list.length : null;\n    html += `\u003ch4>\u003cspan class=\"dot\" style=\"background:${EL[a.el] ? EL[a.el].color : '#ff69b4'}\">\u003c/span>${esc(a.label)}\u003csmall>CN ${list.length}${mean ? ' · mean ' + fmt(mean, 4) + ' Å' : ''}\u003c/small>\u003c/h4>`;\n    html += list.length ? tableHTML(['Neighbour', 'El.', 'Distance Å', 'Count'], [...groups.values()].map((g) => ({ cells: [esc(g.label), esc(g.el), fmt(g.d, 4), g.c] })), { num: [2, 3] }) : '\u003cp class=\"note\">No neighbours within the cutoff.\u003c/p>';\n  });\n  return html + '\u003cp class=\"note\">Bonds are drawn when the distance is below the sum of the covalent radii plus the tolerance. Metal–metal contacts are skipped when the structure also contains non-metals.\u003c/p>';\n}\n\nfunction symmetryTab() {\n  const info = kv([\n    ['Space group', S.sgName ? esc(S.sgName) : '–'],\n    ['Hall symbol', S.hall ? esc(S.hall) : null],\n    ['IT number', S.itNum ? esc(S.itNum) : null],\n    ['Crystal system', esc(S.system[0])],\n    ['Centering', esc(S.centering)],\n    ['Operators', S.ops.length],\n    ['Unique sites', S.asym.length],\n    ['Positions in cell', S.cellAtoms.length],\n  ]);\n  const tbl = tableHTML(['#', 'Operator (x, y, z)'], S.ops.map((o, i) => ({ cells: [i + 1, `\u003cspan class=\"mono\">${esc(o.s)}\u003c/span>`] })), { num: [0], tall: true });\n  return `\u003ch3>Space group\u003c/h3>${info}\u003ch3>Symmetry operators\u003c/h3>${tbl}`;\n}\n\nfunction dataTab() {\n  const q = state.filter.trim().toLowerCase();\n  const wrap = `\u003cinput type=\"search\" class=\"search\" id=\"dataFilter\" placeholder=\"Filter tags and values\" value=\"${esc(state.filter)}\" aria-label=\"Filter data\">\u003cdiv id=\"dataList\">\u003c/div>`;\n  return wrap;\n}\nfunction dataList() {\n  const q = state.filter.trim().toLowerCase();\n  const b = S.block;\n  const hit = (a) => !q || a.some((s) => String(s).toLowerCase().includes(q));\n  const items = b.itemOrder.filter((it) => hit([it.orig, b.items[it.tag]]));\n  let html = `\u003ch3>Single values (${items.length})\u003c/h3>`;\n  html += items.length ? tableHTML(['Tag', 'Value'], items.map((it) => ({ cells: [`\u003cspan class=\"mono\">${esc(it.orig)}\u003c/span>`, esc(b.items[it.tag])], wrapIdx: 1 })), { tall: true }) : '\u003cp class=\"empty\">No matching single values.\u003c/p>';\n  b.loops.forEach((lp) => {\n    const rows = lp.rows.filter((r) => hit(r.concat(lp.orig)));\n    if (q && !rows.length) return;\n    const LIM = 400;\n    html += `\u003ch3>Loop: ${esc(lp.orig[0] || '')} … \u003csmall class=\"note\">${rows.length} rows × ${lp.orig.length} columns\u003c/small>\u003c/h3>`;\n    html += tableHTML(lp.orig.map((o) => esc(o.replace(/^_/, ''))), rows.slice(0, LIM).map((r) => ({ cells: r.map((c) => esc(c)) })), { tall: true });\n    if (rows.length > LIM) html += `\u003cp class=\"note\">Showing the first ${LIM} rows. See the Raw CIF tab for everything.\u003c/p>`;\n  });\n  return html;\n}\n\nfunction rawTab() { return '\u003cpre class=\"raw\" id=\"rawPre\">\u003c/pre>'; }\n\nfunction renderTab() {\n  if (!S) return;\n  const body = $('#tabBody');\n  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));\n  const keepScroll = body.scrollTop;\n  switch (state.tab) {\n    case 'summary': body.innerHTML = summaryTab(); break;\n    case 'atoms': body.innerHTML = atomsTab(); break;\n    case 'bonds': body.innerHTML = bondsTab(); break;\n    case 'symmetry': body.innerHTML = symmetryTab(); break;\n    case 'data': body.innerHTML = dataTab(); $('#dataList').innerHTML = dataList(); break;\n    case 'raw': body.innerHTML = rawTab(); $('#rawPre').textContent = rawText.length > 400000 ? rawText.slice(0, 400000) + '\\n\\n[truncated for display]' : rawText; break;\n  }\n  body.scrollTop = keepScroll;\n}\n\n/* ---------------- wiring ---------------- */\nfunction setSeg(seg, attr, val) { seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === val))); }\nfunction wire() {\n  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (!b) return; state.tab = b.dataset.tab; renderTab(); $('#tabBody').scrollTop = 0; });\n  $('#tabBody').addEventListener('click', (e) => {\n    const sb = e.target.closest('#atomsSeg button'); if (sb) { state.atomsView = sb.dataset.v; renderTab(); return; }\n    const tr = e.target.closest('tr.pick');\n    if (tr) { const l = tr.dataset.label; state.focus = state.focus === l ? null : l; renderTab(); buildScene(); }\n  });\n  $('#tabBody').addEventListener('input', (e) => { if (e.target.id === 'dataFilter') { state.filter = e.target.value; $('#dataList').innerHTML = dataList(); } });\n  $('#styleSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.style = b.dataset.style; setSeg($('#styleSeg'), 'style', state.style); buildScene(); });\n  $('#viewSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.view === 'reset') resetView(); else viewAlong(b.dataset.view); });\n  const chk = (id, key, rebuild) => $(id).addEventListener('change', (e) => { state[key] = e.target.checked; if (rebuild) buildScene(); else dirty = true; });\n  chk('#chkCell', 'cell', true); chk('#chkBonds', 'bonds', true); chk('#chkBoundary', 'boundary', true); chk('#chkAxes', 'axes', false); chk('#chkRotate', 'autorot', false);\n  let rt = 0;\n  $('#rngSize').addEventListener('input', (e) => { state.size = +e.target.value; buildScene(); });\n  $('#rngTol').addEventListener('input', (e) => { state.tol = +e.target.value; $('#tolOut').textContent = state.tol.toFixed(2) + ' Å'; clearTimeout(rt); rt = setTimeout(() => { nbCache = null; buildScene(); if (['atoms', 'bonds', 'summary'].includes(state.tab)) renderTab(); }, 60); });\n  ['#scA', '#scB', '#scC'].forEach((id, k) => $(id).addEventListener('change', (e) => {\n    let v = Math.round(+e.target.value); v = Math.min(6, Math.max(1, isFinite(v) ? v : 1));\n    const next = state.sc.slice(); next[k] = v;\n    if (S && S.cellAtoms.length * next[0] * next[1] * next[2] > MAX_ATOMS) { toast('That supercell would draw more than ' + MAX_ATOMS.toLocaleString() + ' atoms. Try a smaller repeat.'); setSC(); return; }\n    state.sc = next; setSC(); selected = []; buildScene(); resetFit();\n  }));\n  $('#legend').addEventListener('click', (e) => { const b = e.target.closest('button[data-el]'); if (!b) return; const el = b.dataset.el; if (state.hidden.has(el)) state.hidden.delete(el); els -scheme:dark;--pn:var(--surface);--mut:var(--muted);--ln:var(--line);--cv:var(--stage);--yl:var(--accent);}body{font-family:var(--fb)}h1{font-family:var(--fd);font-size:1.75rem;letter-spacing:-.01em}.p{border-radius:10px}\nlabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}canvas{border-width:1px;border-radius:10px}#ms{border:3px solid var(--ln)}\nselect{font-family:var(--fm);font-size:.9rem;border-radius:6px}code{font-family:var(--fm)}\nbutton{background:var(--yl);color:var(--on);border-radius:6px;font-weight:600;font-size:.9rem;padding:9px 20px}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline-color:var(--yl)}\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"w\">\n\u003ch1>Phase Diagram &amp; Microstructure Explorer\u003c/h1>\n\u003cdiv class=\"p\">\u003clabel for=\"sy\">Select system\u003c/label>\u003cselect id=\"sy\">\u003c/select>\n\u003cp class=\"nt\">Click any point on the phase diagram: cooling starts from that composition and temperature.\u003c/p>\u003c/div>\n\u003cdiv class=\"p\">\u003cdiv class=\"hd\">\u003cb>Microstructure View\u003c/b>\u003cspan id=\"tt\">\u003c/span>\u003cspan id=\"ph\">\u003c/span>\u003c/div>\n\u003cdiv class=\"r\">\u003cdiv>\u003ccanvas id=\"ms\" width=\"360\" height=\"360\" aria-label=\"Microstructure\">\u003c/canvas>\n\u003cdiv class=\"lg\" id=\"lg\">\u003c/div>\u003c/div>\n\u003cdiv>\u003ccanvas id=\"dg\" width=\"760\" height=\"560\" aria-label=\"Phase diagram\">\u003c/canvas>\u003c/div>\u003c/div>\n\u003cp class=\"nt\" id=\"inf\">\u003c/p>\u003c/div>\n\u003cdiv class=\"p\">\u003cdiv class=\"ct\">\u003cdiv>\u003clabel for=\"rt\">Cooling Rate\u003c/label>\u003cinput id=\"rt\" type=\"range\" min=\"5\" max=\"200\" value=\"40\">\u003ccode id=\"rv\">40 °C/s\u003c/code>\u003c/div>\n\u003cdiv>\u003clabel for=\"cp\">Composition\u003c/label>\u003cinput id=\"cp\" type=\"range\" min=\"0\" max=\"100\" step=\"0.01\" value=\"30\">\u003ccode id=\"cv\">\u003c/code>\u003c/div>\u003c/div>\n\u003cdiv class=\"bt\">\u003cbutton id=\"go\">Start Cooling\u003c/button>\u003cbutton id=\"rs\">Reset\u003c/button>\u003c/div>\u003c/div>\n\u003cp class=\"nt\">Educational schematic: phase boundaries are approximate and fractions are computed with the lever rule. Not a substitute for experimental data.\u003c/p>\n\u003c/div>\n\u003cscript>\nconst C={L:[240,160,90],'α':[236,239,242],'β':[143,184,224],'γ':[169,191,214],'δ':[201,182,224],Fe3C:[59,61,74]};\nconst cvv=(x0,T0,x1,T1,f,n=12)=>{const a=[];for(let i=0;i\u003c=n;i++){const t=i/n;a.push([x0+(x1-x0)*t,T0+(T1-T0)*f(t)])}return a};\nconst rv=a=>[...a].reverse();\nfunction iso(n,A,B,Ta,Tb,c0){const Tt=Math.max(Ta,Tb)+80,T0=Math.min(Ta,Tb)-200;\n const liq=cvv(0,Ta,100,Tb,t=>t**.8),sol=cvv(0,Ta,100,Tb,t=>t**1.3);\n return{n,A,B,xm:100,T0,Tt,c0,g:'Isomorphous',ln:[],reg:[{p:['L'],g:[[0,Tt],[100,Tt],...rv(liq)]},{p:['L','α'],g:[...sol,...rv(liq)]},{p:['α'],g:[...sol,[100,T0],[0,T0]]}]}}\nfunction eut(n,A,B,Ta,Tb,Te,xe,xa,xb,xa0,xb0,T0,c0){const Tt=Math.max(Ta,Tb)+60;\n const Ll=cvv(0,Ta,xe,Te,t=>1-(1-t)**1.25),Sl=cvv(0,Ta,xa,Te,t=>1-(1-t)**1.6),Lr=cvv(xe,Te,100,Tb,t=>t**1.25),Sr=cvv(xb,Te,100,Tb,t=>t**1.6),V1=cvv(xa,Te,xa0,T0,t=>t),V2=cvv(xb,Te,xb0,T0,t=>t);\n return{n,A,B,xm:100,T0,Tt,c0,g:'Eutectic',ln:[{T:Te,k:'E',a:xa,m:xe,b:xb,pa:'α',pb:'β',nm:'Eutectic structure'}],\n reg:[{p:['L'],g:[[0,Tt],[100,Tt],...rv(Lr),...rv(Ll)]},{p:['α','L'],g:[...Sl,...rv(Ll)]},{p:['L','β'],g:[...Lr,...rv(Sr)]},\n {p:['α'],g:[...Sl,...V1,[0,T0]]},{p:['β'],g:[...Sr,[100,T0],...rv(V2)]},{p:['α','β'],g:[...V2,...rv(V1)]}]}}\nconst FC={n:'Fe–Fe₃C (Iron–Carbide)',A:'Fe',B:'C',xm:6.67,T0:400,Tt:1600,c0:.4,g:'Peritectic + Eutectic + Eutectoid',\n ln:[{T:1495,k:'P'},{T:1147,k:'E',a:2.14,m:4.3,b:6.67,pa:'γ',pb:'Fe3C',nm:'Ledeburite'},{T:727,k:'D',par:'γ',a:.022,m:.76,b:6.67,pa:'α',pb:'Fe3C',nm:'Pearlite'}],\n reg:[{p:['L'],g:[[0,1600],[6.67,1600],[6.67,1227],[4.3,1147],[2.14,1330],[.53,1495],[0,1538]]},\n {p:['δ','L'],g:[[0,1538],[.09,1495],[. et\u003c/button>\u003c/div>\u003c/div>\n\u003cp class=\"nt\">Educational model: curve positions are approximate handbook-style values. Transformation kinetics use an Avrami law with Scheil additivity for continuous cooling and Koistinen–Marburger for martensite.\u003c/p>\n\u003c/div>\n\u003cscript>\nconst C={fe:[236,239,242],cm:[59,61,74],au:[169,191,214],ma:[40,43,56]};\n// Steel data. Merged (mg) = single C-curve: pearlite above Tsp, bainite below. Others: separate P and B curves.\nconst S=[\n{n:'AISI 1020 (0.20 C)',c:.2,A1:727,Ms:450,mg:1,Pn:600,lt:.5,h:.8,hl:.35,Tsp:520,rf:25},\n{n:'AISI 1045 (0.45 C)',c:.45,A1:727,Ms:345,mg:1,Pn:580,lt:.5,h:.8,hl:.35,Tsp:500,rf:25},\n{n:'AISI 1060 (0.60 C)',c:.6,A1:727,Ms:300,mg:1,Pn:560,lt:.3,h:.75,hl:.35,Tsp:480,rf:25},\n{n:'AISI 1080 (0.80 C, eutectoid)',c:.8,A1:727,Ms:220,mg:1,Pn:540,lt:0,h:.7,hl:.35,Tsp:460,rf:25},\n{n:'AISI 1095 (0.95 C)',c:.95,A1:727,Ms:190,mg:1,Pn:530,lt:.2,h:.7,hl:.35,Tsp:450,rf:25},\n{n:'AISI 4130 (0.30 C, Cr-Mo)',c:.3,A1:755,Ms:400,Pn:650,lt:1.5,h:1.2,hl:2.2,Bs:560,Bn:480,lb:1.3,hb:1,hlb:.6,rf:20},\n{n:'AISI 4140 (0.40 C, Cr-Mo)',c:.4,A1:740,Ms:340,Pn:640,lt:2.5,h:1.2,hl:2.2,Bs:550,Bn:470,lb:1.8,hb:1,hlb:.6,rf:20},\n{n:'AISI 4340 (0.40 C, Ni-Cr-Mo)',c:.4,A1:725,Ms:290,Pn:620,lt:3.4,h:1.2,hl:2.2,Bs:520,Bn:440,lb:2.2,hb:1,hlb:.6,rf:20},\n{n:'AISI 5160 (0.60 C, Cr)',c:.6,A1:730,Ms:260,Pn:650,lt:1.7,h:1.2,hl:2.2,Bs:500,Bn:420,lb:1.3,hb:1,hlb:.6,rf:20},\n{n:'AISI 8620 (0.20 C, Ni-Cr-Mo)',c:.2,A1:730,Ms:400,Pn:640,lt:2,h:1.2,hl:2.2,Bs:540,Bn:460,lb:1.5,hb:1,hlb:.6,rf:20},\n{n:'AISI 52100 (1.0 C, bearing)',c:1,A1:740,Ms:240,Pn:640,lt:1.4,h:1.2,hl:2.2,Bs:480,Bn:400,lb:1.2,hb:1,hlb:.6,rf:20}];\nS.forEach(s=>{s.A3=s.c\u003c.77?Math.max(s.A1,910-203*Math.sqrt(s.c)-(s.A1-727)*0):727+(1148-727)*(s.c-.77)/1.37;if(s.c\u003c.77)s.A3=Math.max(s.A1+5,s.A3);s.Mf=s.Ms-230;s.n_=6.13/Math.log(s.rf);s.low=s.mg?s.Ms:s.Bs-40;s.plow=s.mg?s.Tsp:s.Bs-40;s.Ta=Math.round(s.A3+50);\n s.fpm=s.c\u003c.77?(.77-s.c)/.75:(s.c-.77)/5.9});\nconst lg=(T,Tn,Tt,l,h,hl)=>{if(T>=Tn){const u=(T-Tn)/(Tt-Tn);return u>=1?9:l+h*u*u/(1-.93*u)}const v=(Tn-T)/100;return l+hl*v*v};\nconst tsP=(s,T)=>(T>=s.A1||T\u003c=s.Ms||T\u003cs.low)?Infinity:10**lg(T,s.Pn,s.A1,s.lt,s.h,s.hl);\nconst tsB=(s,T)=>(s.mg||T>=s.Bs||T\u003c=s.Ms)?Infinity:10**lg(T,s.Bn,s.Bs,s.lb,s.hb,s.hlb);\nconst Fa=(p,n)=>1-Math.exp(-.01005*Math.pow(p,n));\n// geometry (grains)\nconst W=360,N=W*W,id=new Uint8Array(N),bd=new Float32Array(N),sB=new Float32Array(N);\nconst rn=[],cs=[],sn=[],c2=[],s2=[],ph0=[],sd=[];let sr=11;const R=()=>(sr=(sr*16807)%2147483647)/2147483647;const G=6;\nfor(let i=0;i\u003cG;i++)for(let j=0;j\u003cG;j++){sd.push([(i+.1+.8*R())*W/G,(j+.1+.8*R())*W/G]);rn.push(R());ph0.push(R()*6.28);const a=R()*3.14;cs.push(Math.cos(a));sn.push(Math.sin(a));c2.push(Math.cos(a+.6));s2.push(Math.sin(a+.6))}\nfor(let y=0;y\u003cW;y++)for(let x=0;x\u003cW;x++){const i=y*W+x,wx=x+9*Math.sin(y/23+1)+5*Math.sin(y/9+x/40),wy=y+9*Math.sin(x/27)+5*Math.sin(x/11-y/37);\n let b1=1e9,b2=1e9,k=0;for(let q=0;q\u003csd.length;q++){const d=(sd[q][0]-wx)**2+(sd[q][1]-wy)**2;if(d\u003cb1){b2=b1;b1=d;k=q}else if(d\u003cb2)b2=d}\n id[i]=k;bd[i]=(Math.sqrt(b2)-Math.sqrt(b1))/2}\nsB.set(bd);sB.sort();const qt=f=>f\u003c=0?0:sB[Math.min(N-1,Math.floor(f*N))];\n// state\nconst $=q=>document.getElementById(q),dg=$('dg'),dx=dg.getContext('2d'),mx=$('ms').getContext('2d'),img=mx.createImageData(W,W);\nlet s,mode='TTT',Tiso,rate=10,run=false,t,T,Tq,tq,q,fF,fP,fB,fM,pp,pb,rP,rB,cF,aMs,pitch,trail,ccv;\nconst sel=$('sy');S.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.n;sel.appendChild(o)});\nfunction reset(){run=false;t=.1;T=s.Ta;q=false;fF=fP=fB=fM=pp=pb=rP=rB=cF=0;aMs=null;pitch=9;trail=[[t,T]];$('go').textContent='Start Cooling'}\nfunction load(i){s=S[i];const h=$('hold');h.min=Math.round(s.Ms+10);h.max=s.A1-5;Tiso=Math.round(Math.min(s.A1-5,Math.max(s.Ms+10,s.mg?s.Pn-30:s.Pn)));h.value=Tiso;ccv=cct(s);ui();reset()}\nfunction ui(){const m=mode==='TTT';$('c1').style.display=m?'':'none';$('qn').style.display=m?'':'none';$('v1').textContent=Tiso+' °C';$('v2').textContent=rate.toPrecision(2)+' °C/s';\n $('hint').textContent=m?'TTT: the sample is quenched instantly to the hold temperature and held. Click the diagram to choose a hold temperature.':'CCT: the sample cools at a constant rate from the austenitizing temperature. Click the diagram to choose a cooling line.';\n legend()}\nfunction legend(){const L=[['Austenite','rgb(169,191,214)'],[s.c\u003c.77?'Proeutectoid ferrite':'Proeutectoid cementite',s.c\u003c.77?'rgb(236,239,242)':'rgb(59,61,74)'],['Pearlite','repeating-linear-gradient(90deg,#ecf0f2 0 5px,#3b3d4a 5px 7px)'],['Bainite','repeating-linear-gradient(60deg,#cdd0d8 0 4px,#5f6270 4px 7px)'],['Martensite','#282b38']];\n $('lg').innerHTML=L.map(a=>`\u003cspan>\u003ci style=\"background:${a[1]}\">\u003c/i>${a[0]}\u003c/span>`).join('');\n $('lg2').innerHTML=[['Pearlite','#c0392b'],['Bainite','#2e8b57'],['Ms / Mf','#2b6cb0'],['A1 / A3 or Acm','#888']].map(a=>`\u003cspan>\u003ci style=\"background:${a[1]}\">\u003c/i>${a[0]}\u003c/span>`).join('')+'\u003cspan>solid = 1% start, dashed = 99% finish\u003c/span>'}\n// continuous-cooling (Scheil) curves\nfunction cct(s){const o={P:[[],[]],B:[[],[]]};\n for(let e=-3.2;e\u003c=3.3;e+=.05){const r=10**e;let a=0,b=0,sa=0,sb=0;\n  for(let Tc=s.A1-1;Tc>s.Ms;Tc--){const tt=(s.Ta-Tc)/r;const x=tsP(s,Tc),y=tsB(s,Tc);\n   if(x\u003c1e30){a+=1/r/x;if(!sa&&a>=1){sa=1;(s.mg&&Tc\u003cs.Tsp?o.B:o.P)[0].push([tt,Tc])}if(sa\u003c2&&a>=s.rf){sa=2;(s.mg&&Tc\u003cs.Tsp?o.B:o.P)[1].push([tt,Tc])}}\n   if(y\u003c1e30){b+=1/r/y;if(!sb&&b>=1){sb=1;o.B[0].push([tt,Tc])}if(sb\u003c2&&b>=s.rf){sb=2;o.B[1].push([tt,Tc])}}}}\n return o}\nfunction ttt(s){const o={P:[[],[]],B:[[],[]]};for(let Tc=s.A1-1;Tc>s.Ms;Tc-=1.5){const x=tsP(s,Tc),y=tsB(s,Tc),dp=s.mg&&Tc\u003cs.Tsp?o.B:o.P;\n if(x\u003c1e30){dp[0].push([x,Tc]);dp[1].push([x*s.rf,Tc])}if(y\u003c1e30){o.B[0].push([y,T
